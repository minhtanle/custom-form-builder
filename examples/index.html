<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Test Web Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Component tự động chèn CSS built-in khi mount, không cần Tailwind CDN -->
</head>

<body>

    <h1>Ứng dụng JavaScript thuần</h1>
    <hr>

    <!-- Gọi thẻ Custom Element -->
    <custom-dynamic-form id="my-form"></custom-dynamic-form>

    <div style="margin-top: 20px;">
        <button type="button" id="my-submit-btn" style="padding: 10px 24px; font-family: 'Roboto', sans-serif; font-size: 16px; border: none; border-radius: 8px; background-color: #4F62F8; color: #fff; cursor: pointer;">Gửi thông tin</button>
        <button type="button" id="my-edit-btn" style="padding: 10px 24px; font-family: 'Roboto', sans-serif; font-size: 16px; border: none; border-radius: 8px; background-color: #F59E0B; color: #fff; cursor: pointer;">Mở lại bản ghi (edit)</button>
    </div>

    <script type="module" src="/src/CustomDynamicForm.jsx"></script>
    <script>
        // Giả lập sau khi trang load xong, nạp schema động từ DB PHP vào thẻ
        window.addEventListener('load', () => {
            const formEl = document.getElementById('my-form');

            formEl.schema = {
                "type": "object",
                "description": "Đăng ký tham gia. Chọn 'Khác' nếu bạn là runner tự do.",
                "properties": {
                    "relation": {
                        "type": "integer",
                        "title": "Đối tượng liên kết",
                        "default": 1,
                        "oneOf": [
                            { "const": 1, "title": "Thành viên" },
                            { "const": 2, "title": "Khách hàng / đối tác" },
                            { "const": 3, "title": "Khác" }
                        ]
                    },
                    "ma_nhan_vien": {
                        "type": "string",
                        "title": "Mã nhân viên / Số bảo hiểm"
                    },
                    "ten_don_vi_gioi_thieu": {
                        "type": "string",
                        "title": "Tên đơn vị giới thiệu",
                        "enum": [
                            "VRB Trụ sở chính",
                            "VRB Vũng Tàu",
                            "VRB Khánh Hòa",
                            "VRB Hải Phòng",
                            "VRB Sở Giao dịch",
                            "VRB TP. Hồ Chí Minh",
                            "VRB Đà Nẵng"
                        ]
                    },
                    "tinh_thanh": {
                        "type": "string",
                        "title": "Tỉnh/Thành phố",
                        "enum": ["Hà Nội", "TP. Hồ Chí Minh", "Đà Nẵng", "Hải Phòng"]
                    },
                    "ten_truong": {
                        "type": "string",
                        "title": "Tên trường"
                    },
                    "dang_ky_nhan_tin": {
                        "type": "boolean",
                        "title": "Tôi đồng ý nhận thông tin chương trình",
                        "default": true
                    }
                },
                "required": ["relation", "tinh_thanh", "ten_truong"],
                "allOf": [
                    {
                        "if": { "properties": { "relation": { "const": 1 } } },
                        "then": { "required": ["ma_nhan_vien"] }
                    },
                    {
                        "if": { "properties": { "relation": { "const": 2 } } },
                        "then": { "required": ["ten_don_vi_gioi_thieu"] }
                    }
                ]
            };

            formEl.uiSchema = {
                "idPrefix": "demo",
                "fields": {
                    "relation": { "ui:widget": "radio" },
                    "ma_nhan_vien": { "ui:widget": "text" },
                    "ten_don_vi_gioi_thieu": { "ui:widget": "custom-select" },
                    "tinh_thanh": { "ui:widget": "select" },
                    "ten_truong": { "ui:widget": "text" },
                    "dang_ky_nhan_tin": { "ui:widget": "checkbox" }
                },
                "layout": [
                    {
                        "type": "row",
                        "fields": [{ "name": "relation", "grid": 12 }]
                    },
                    {
                        "type": "row",
                        "fields": [
                            { "name": "tinh_thanh", "grid": 6 },
                            { "name": "ten_truong", "grid": 6 }
                        ]
                    },
                    {
                        "type": "row",
                        "fields": [{ "name": "dang_ky_nhan_tin", "grid": 6 }]
                    }
                ]
            };

            // Nhận kết quả khi form pass qua tất cả các rule validate của engine
            formEl.addEventListener('onFormSubmit', (e) => {
                alert("Validate THÀNH CÔNG trên FE!\nDữ liệu sẵn sàng gửi lên Backend PHP:\n" + JSON.stringify(e.detail));
            });

            // Nút submit để ngoài form → gọi qua phương thức public submitForm()
            document.getElementById('my-submit-btn').addEventListener('click', () => {
                formEl.submitForm();
            });

            // Luồng EDIT lại thông tin: gắn data (bản ghi đã lưu) 1 lần khi mở form → form prefill giá trị cũ
            document.getElementById('my-edit-btn').addEventListener('click', () => {
                formEl.data = {
                    "relation": 2, // → field con "ten_don_vi_gioi_thieu" hiện lại vì required theo allOf
                    "ten_don_vi_gioi_thieu": "VRB Vũng Tàu",
                    "tinh_thanh": "Đà Nẵng",
                    "ten_truong": "ĐH Bách Khoa",
                    "dang_ky_nhan_tin": false
                };
            });
        });
    </script>
</body>

</html>
